<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FAFAF7">
<title>日本語ライフ - 欢迎</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 0; }
  .jp { font-family: "Noto Sans JP", sans-serif; }

  .hero {
    padding: 60px 32px 24px 32px;
    text-align: center;
  }
  .hero-logo {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #BC4E51, #E76F72);
    border-radius: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 32px;
    font-weight: 800;
    box-shadow: 0 8px 24px rgba(188,78,81,0.3);
    margin-bottom: 16px;
  }
  .hero h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 6px 0;
  }
  .hero .jp-sub {
    font-size: 14px;
    color: #64748B;
    font-weight: 500;
  }

  .points {
    padding: 0 32px;
  }
  .point {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid rgba(15,23,42,0.06);
  }
  .point:last-child { border-bottom: none; }
  .point .num {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(188,78,81,0.1), rgba(188,78,81,0.04));
    color: #BC4E51;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 800;
    flex-shrink: 0;
  }
  .point .ico {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 18px;
    flex-shrink: 0;
  }
  .point .body { flex: 1; min-width: 0; }
  .point .body .t {
    font-size: 15px;
    font-weight: 600;
    color: #0F172A;
  }
  .point .body .s {
    font-size: 12px;
    color: #64748B;
    margin-top: 2px;
  }

  .cta-wrap {
    padding: 24px 32px 60px 32px;
  }
  .cta {
    display: block;
    background: linear-gradient(135deg, #BC4E51, #E76F72);
    color: white;
    text-align: center;
    padding: 16px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 15px;
    box-shadow: 0 8px 24px rgba(188,78,81,0.3);
  }
  .cta:active { transform: scale(0.98); }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="phone-screen">
    <div data-auto-stepper></div>

    <div class="hero">
      <div class="hero-logo jp">日</div>
      <h1>日本語ライフ</h1>
      <p class="jp-sub">4 个使用要点</p>
    </div>

    <div class="points">
      <div class="point">
        <div class="ico" style="background: linear-gradient(135deg, #10B981, #34D399);">
          <i class="fas fa-layer-group"></i>
        </div>
        <div class="body">
          <div class="t">顶部切换 N5 - N1</div>
          <div class="s">← → 选择等级，点数字可直达</div>
        </div>
      </div>

      <div class="point">
        <div class="ico" style="background: linear-gradient(135deg, #1B3A5C, #3A5F87);">
          <i class="fas fa-newspaper"></i>
        </div>
        <div class="body">
          <div class="t">每天一篇 NHK 新闻</div>
          <div class="s">真实广播 · 振假名 · 点词查义</div>
        </div>
      </div>

      <div class="point">
        <div class="ico" style="background: linear-gradient(135deg, #F59E0B, #FBBF24);">
          <i class="fas fa-microphone"></i>
        </div>
        <div class="body">
          <div class="t">拼写练习两套模式</div>
          <div class="s">N5-N3 发音辅助 · N2-N1 录音纠正</div>
        </div>
      </div>

      <div class="point">
        <div class="ico" style="background: linear-gradient(135deg, #EC4899, #F472B6);">
          <i class="fas fa-bookmark"></i>
        </div>
        <div class="body">
          <div class="t">单词本永久保存</div>
          <div class="s">收藏 / 错词 / 跳过 · 不每日覆盖</div>
        </div>
      </div>
    </div>

    <div class="cta-wrap">
      <a href="home.html" class="cta">
        开始 <i class="fas fa-arrow-right" style="margin-left: 6px;"></i>
      </a>
    </div>

  </div>
</div>
</body>
</html>
