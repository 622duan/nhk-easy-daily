<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FAFAF7">
<title>日本語ライフ - 首页</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  .jp { font-family: "Noto Sans JP", sans-serif; }

  .hero-bg {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 180px;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(188,78,81,0.18) 0%, transparent 60%),
      radial-gradient(ellipse at 100% 0%, rgba(27,58,92,0.12) 0%, transparent 50%),
      var(--kinari);
    z-index: 0;
  }
  .hero-content { position: relative; z-index: 1; }

  /* 紧凑 streak 卡片 */
  .streak-card {
    background: linear-gradient(135deg, #BC4E51 0%, #E76F72 100%);
    color: white;
    border-radius: 16px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .streak-card::after {
    content: "日本語";
    position: absolute;
    right: -16px;
    top: 50%;
    transform: translateY(-50%) rotate(-12deg);
    font-size: 48px;
    font-weight: 900;
    color: rgba(255,255,255,0.08);
    font-family: "Noto Sans JP", serif;
  }
  .streak-card .num {
    font-size: 20px;
    font-weight: 800;
    line-height: 1;
  }

  /* 紧凑入口卡 */
  .entry-card {
    background: white;
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.04);
    transition: all 0.2s;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .entry-card:active { transform: scale(0.97); }
  .entry-card .icon {
    width: 32px; height: 32px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: white;
    flex-shrink: 0;
  }
  .entry-card .title {
    font-size: 13px; font-weight: 700; color: var(--sumi);
    line-height: 1.2;
  }
  .entry-card .sub {
    font-size: 9px; color: var(--hae);
    margin-top: 1px;
  }

  /* 紧凑新闻卡（横向） */
  .news-row {
    background: white;
    border-radius: 14px;
    padding: 10px;
    display: flex;
    gap: 10px;
    align-items: center;
    box-shadow: 0 1px 3px rgba(15,23,42,0.04);
  }
  .news-row .thumb {
    width: 64px;
    height: 64px;
    border-radius: 10px;
    background-size: cover;
    background-position: center;
    position: relative;
    flex-shrink: 0;
  }
  .news-row .thumb .play {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.25);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 14px;
  }
  .news-row .body { flex: 1; min-width: 0; }
  .news-row .title {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.4;
    color: var(--sumi);
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  /* 紧凑工具行 */
  .tool-row {
    background: white;
    border-radius: 14px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.04);
  }
  .tool-row .ico {
    width: 32px; height: 32px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    color: white;
    font-size: 14px;
    flex-shrink: 0;
  }
  .tool-row .lbl { flex: 1; }
  .tool-row .lbl .t { font-size: 13px; font-weight: 700; }
  .tool-row .lbl .s { font-size: 10px; color: var(--hae); margin-top: 1px; }
  .tool-row .arr { color: var(--hae); font-size: 10px; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="phone-screen">

    <!-- 状态栏 -->
    <div class="hero-bg"></div>
    <div class="hero-content">

      <!-- 顶部欢迎（紧凑） -->
      <div class="px-5 pt-2 pb-1 flex items-center justify-between">
        <div>
          <p class="text-xs text-muted" style="font-size: 10px;">おはようございます</p>
          <h1 class="font-bold" style="font-size: 18px; letter-spacing: -0.02em; margin-top: 1px;">张同学 👋</h1>
        </div>
        <a href="profile.html" class="btn-icon" style="background: white; box-shadow: var(--sh-soft); width: 34px; height: 34px; font-size: 14px;">
          <i class="far fa-user"></i>
        </a>
      </div>

      <!-- 等级 Stepper -->
      <div data-auto-stepper></div>

      <!-- 连续打卡（紧凑） -->
      <div class="px-5 mt-2">
        <div class="streak-card">
          <div>
            <p class="text-xs" style="opacity: 0.85; font-size: 10px;">连续学习</p>
            <p class="num mt-1">🔥 23 天</p>
            <p class="text-xs mt-1" style="opacity: 0.85; font-size: 9px;">今天已学 12 分钟 · <span data-bind="streakSub">N5 · 50词/周</span></p>
          </div>
          <a href="spell-easy.html" class="btn" style="background: white; color: var(--akane); font-size: 12px; padding: 7px 14px;">
            继续 <i class="fas fa-arrow-right text-xs"></i>
          </a>
        </div>
      </div>

      <!-- 4 大入口（紧凑 2x2） -->
      <div class="px-5 mt-3">
        <div class="grid grid-cols-2 gap-2">
          <a href="vocab-list.html" class="entry-card">
            <div class="icon" style="background: linear-gradient(135deg, #BC4E51, #E76F72);">
              <i class="fas fa-book"></i>
            </div>
            <div>
              <div class="title">单词</div>
              <div class="sub" data-bind="streakSub">N5 · 50词/周</div>
            </div>
          </a>
          <a href="news-list.html" class="entry-card">
            <div class="icon" style="background: linear-gradient(135deg, #1B3A5C, #3A5F87);">
              <i class="fas fa-newspaper"></i>
            </div>
            <div>
              <div class="title">新闻</div>
              <div class="sub">NHK 真实广播</div>
            </div>
          </a>
          <a href="keigo-index.html" class="entry-card">
            <div class="icon" style="background: linear-gradient(135deg, #F59E0B, #FBBF24);">
              <i class="fas fa-comment-dots"></i>
            </div>
            <div>
              <div class="title">敬语</div>
              <div class="sub">3 大体系</div>
            </div>
          </a>
          <a href="verb-index.html" class="entry-card">
            <div class="icon" style="background: linear-gradient(135deg, #10B981, #34D399);">
              <i class="fas fa-magic"></i>
            </div>
            <div>
              <div class="title">动词变形</div>
              <div class="sub">10 种活用</div>
            </div>
          </a>
          <a href="grammar-index.html" class="entry-card">
            <div class="icon" style="background: linear-gradient(135deg, #7C3AED, #A78BFA);">
              <i class="fas fa-feather-alt"></i>
            </div>
            <div>
              <div class="title">文法</div>
              <div class="sub">句型详解</div>
            </div>
          </a>
        </div>
      </div>

      <!-- 拼写（横向 2 个） -->
      <div class="px-5 mt-2">
        <div class="grid grid-cols-2 gap-2">
          <a href="spell-easy.html" class="entry-card" style="background: linear-gradient(135deg, #F0FDF4 0%, white 100%);">
            <div class="icon" style="background: linear-gradient(135deg, #10B981, #34D399);">
              <i class="fas fa-headphones"></i>
            </div>
            <div>
              <div class="title">发音辅助</div>
              <div class="sub">N5 / N4 / N3</div>
            </div>
          </a>
          <a href="spell-hard.html" class="entry-card" style="background: linear-gradient(135deg, #F5F3FF 0%, white 100%);">
            <div class="icon" style="background: linear-gradient(135deg, #8B5CF6, #A78BFA);">
              <i class="fas fa-microphone"></i>
            </div>
            <div>
              <div class="title">发音纠正</div>
              <div class="sub">N2 / N1</div>
            </div>
          </a>
        </div>
      </div>

      <!-- 今日推荐新闻（紧凑横向） -->
      <div class="px-5 mt-4">
        <div class="flex items-center justify-between mb-2">
          <h2 style="font-size: 14px; font-weight: 700; margin: 0;">今日推荐 · <span data-bind="levelName">N5</span></h2>
          <a href="news-list.html" class="text-xs text-akane font-semi">全部 <i class="fas fa-chevron-right text-xs"></i></a>
        </div>

        <a href="news-detail.html" class="news-row block" id="todayNewsCard" data-bind-href="todayNews.id ? 'news-detail.html?id=' + todayNews.id : 'news-detail.html'">
          <div class="thumb" data-bind-bg="todayNews.thumb" style="background-image: url('https://images.unsplash.com/photo-1480796927426-f609979314bd?auto=format&fit=crop&w=400&q=80');">
            <div class="play"><i class="fas fa-play"></i></div>
          </div>
          <div class="body">
            <div class="flex items-center gap-1 mb-1">
              <span class="badge" data-bind-class="todayNews.badgeClass" style="font-size: 9px; padding: 1px 6px;" data-bind-text="todayNews.badge">N5</span>
              <span class="text-xs text-muted" style="font-size: 9px;">NHK · <span data-bind="todayNews.duration">3:45</span></span>
            </div>
            <div class="title jp" data-bind-html="todayNews.title_jp">東京で新花火の大会</div>
          </div>
        </a>
      </div>

      <!-- 工具入口（单词本 + 五十音） -->
      <div class="px-5 mt-3">
        <a href="wordbook.html" class="tool-row block">
          <div class="ico" style="background: linear-gradient(135deg, #EC4899, #F472B6);">
            <i class="fas fa-bookmark"></i>
          </div>
          <div class="lbl">
            <div class="t">我的单词本</div>
            <div class="s">已收藏 47 · 错词 12 · 待复习 8</div>
          </div>
          <i class="fas fa-chevron-right arr"></i>
        </a>

        <a href="kana.html" class="tool-row block">
          <div class="ico" style="background: linear-gradient(135deg, #1B3A5C, #3A5F87);">
            <i class="fas fa-language"></i>
          </div>
          <div class="lbl">
            <div class="t">五十音图</div>
            <div class="s">平假名 · 片假名 · 点击听发音</div>
          </div>
          <i class="fas fa-chevron-right arr"></i>
        </a>
      </div>

      <div style="height: 100px;"></div>
    </div>

    <!-- 底部 Tab Bar -->
    <div class="tab-bar">
      <a class="tab-bar-item active" href="home.html">
        <i class="fas fa-home"></i><span>首页</span>
      </a>
      <a class="tab-bar-item" href="vocab-list.html">
        <i class="fas fa-graduation-cap"></i><span>学习</span>
      </a>
      <a class="tab-bar-item" href="wordbook.html">
        <i class="fas fa-bookmark"></i><span>单词本</span>
      </a>
      <a class="tab-bar-item" href="profile.html">
        <i class="far fa-user"></i><span>我的</span>
      </a>
    </div>

  </div>
</div>
<script src="../main.js"></script>
<script src="../data.js"></script>
<script src="../nhk-daily.js"></script>
<script>
  // 首页渲染
  function renderHome() {
    const level = JP.State.level;
    const data = JP_DATA[level];
    if (!data) return;

    // 点路径取值 helper
    function get(path) {
      if (path === 'levelName') return level;
      if (path === 'levelFullName') return level + ' · ' + JP.LEVEL_INFO[level].name;
      return path.split('.').reduce((o, k) => o && o[k], data);
    }

    document.querySelectorAll('[data-bind]').forEach(el => {
      const v = get(el.dataset.bind);
      if (v !== undefined) el.textContent = v;
    });
    document.querySelectorAll('[data-bind-html]').forEach(el => {
      const v = get(el.dataset.bindHtml);
      if (v !== undefined) el.innerHTML = v;
    });
    document.querySelectorAll('[data-bind-bg]').forEach(el => {
      const v = get(el.dataset.bindBg);
      if (v !== undefined) el.style.backgroundImage = `url('${v}')`;
    });
    document.querySelectorAll('[data-bind-class]').forEach(el => {
      const v = get(el.dataset.bindClass);
      if (v !== undefined) el.className = 'badge ' + v;
    });
    document.querySelectorAll('[data-bind-text]').forEach(el => {
      const v = get(el.dataset.bindText);
      if (v !== undefined) el.textContent = v;
    });
    document.querySelectorAll('[data-bind-href]').forEach(el => {
      try {
        const v = Function('return ' + el.dataset.bindHref)();
        if (v !== undefined) el.href = v;
      } catch(e) {}
    });
  }

  window.addEventListener('levelchange', renderHome);
  renderHome();
</script>
</body>
</html>
