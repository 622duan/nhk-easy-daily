<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FAFAF7">
<title>単語 - 日本語ライフ</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  .jp { font-family: "Noto Sans JP", sans-serif; }

  .filter-chip {
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.05);
    font-size: 12px;
    color: var(--hae);
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .filter-chip.active {
    background: var(--akane);
    color: white;
  }
  /* filter chips sticky 容器 */
  .filter-sticky {
    position: sticky;
    top: 104px;
    z-index: 39;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    margin: 0 -20px;
    padding: 10px 20px;
    border-bottom: 1px solid rgba(15, 23, 42, 0.05);
  }
  .filter-sticky .row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .word-row {
    background: white;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    transition: all 0.15s;
  }
  .word-row:active { transform: scale(0.98); background: var(--kinari); }

  .word-kanji {
    font-size: 22px;
    font-weight: 600;
    color: var(--sumi);
    line-height: 1.2;
  }
  .word-kana {
    font-size: 12px;
    color: var(--hae);
    margin-top: 2px;
  }
  .word-meaning {
    font-size: 13px;
    color: var(--hae);
    margin-left: auto;
    text-align: right;
    max-width: 110px;
  }
  .word-pos {
    font-size: 10px;
    color: var(--akane);
    background: rgba(188, 78, 81, 0.08);
    padding: 2px 6px;
    border-radius: 4px;
    margin-top: 2px;
    display: inline-block;
  }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="phone-screen">
    <div class="nav-header">
      <div class="flex items-center gap-3">
        <a href="home.html" class="back-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
        <h1>単語</h1>
      </div>
      <div class="flex items-center gap-2">
        <button class="btn-icon" style="width: 36px; height: 36px;"><i class="fas fa-search"></i></button>
        <button class="btn-icon" style="width: 36px; height: 36px;"><i class="fas fa-sliders-h"></i></button>
      </div>
    </div>

    <!-- 等级 Tab -->
    <div data-auto-stepper></div>

    <!-- 学习进度 -->
    <div class="px-5 mt-4">
      <div class="solid-card" style="background: linear-gradient(135deg, #FFF5F5 0%, white 100%);">
        <div class="flex items-center justify-between mb-2">
          <div>
            <p class="text-sm font-bold">本周学习进度</p>
            <p class="text-xs text-muted mt-1">32 / 50 词</p>
          </div>
          <div class="text-2xl font-bold text-akane">64%</div>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width: 64%;"></div>
        </div>
      </div>
    </div>

    <!-- 分类筛选（可点击筛选 + sticky 避免被遮挡） -->
    <div class="filter-sticky">
      <div class="row">
        <div class="filter-chip active" data-pos="all">全部</div>
        <div class="filter-chip" data-pos="名詞">名词</div>
        <div class="filter-chip" data-pos="動詞">动词</div>
        <div class="filter-chip" data-pos="い形容詞">い形容词</div>
        <div class="filter-chip" data-pos="な形容詞">な形容词</div>
        <div class="filter-chip" data-pos="副詞">副词</div>
        <div class="filter-chip" data-pos="代名詞">代词</div>
      </div>
    </div>

    <!-- 词条列表（数据驱动） -->
    <div class="px-5 mt-4">
      <p class="text-xs text-muted mb-3" id="vocabSectionTitle">今日新词 · 7月27日 · <span data-bind="levelName">N5</span></p>
      <div id="vocabListContainer"></div>
      <p class="text-center text-xs text-muted mt-3" id="vocabCount"></p>
    </div>

    <div style="height: 100px;"></div>

    <div class="tab-bar">
      <a class="tab-bar-item" href="home.html">
        <i class="fas fa-home"></i><span>首页</span>
      </a>
      <a class="tab-bar-item active" href="vocab-list.html">
        <i class="fas fa-graduation-cap"></i><span>学习</span>
      </a>
      <a class="tab-bar-item" href="wordbook.html">
        <i class="fas fa-bookmark"></i><span>单词本</span>
      </a>
      <a class="tab-bar-item" href="profile.html">
        <i class="far fa-user"></i><span>我的</span>
      </a>
    </div>

  </div>
</div>
<script src="../main.js"></script>
<script src="../data.js"></script>
<script src="../nhk-daily.js"></script>
<script>
  let currentPosFilter = 'all';

  function renderVocabList() {
    const level = JP.State.level;
    const data = JP_DATA[level];
    if (!data) return;

    // 简单文本绑定
    document.querySelectorAll('[data-bind]').forEach(el => {
      const v = data[el.dataset.bind];
      if (v !== undefined) el.textContent = v;
    });

    let list = data.vocabList || [];

    // 按词性过滤
    if (currentPosFilter !== 'all') {
      list = list.filter(w => w.pos === currentPosFilter);
    }

    const container = document.getElementById('vocabListContainer');
    if (!container) return;

    if (list.length === 0) {
      container.innerHTML = '<p class="text-center text-muted text-sm" style="padding: 40px 0;">该词性下无词条</p>';
      document.getElementById('vocabCount').textContent = '';
      return;
    }

    container.innerHTML = list.map((w, i) => `
      <a href="vocab-card.html?w=${encodeURIComponent(w.word)}" class="word-row">
        <div class="flex-1">
          <div class="jp">
            <span class="word-kanji">${w.word}</span>
            <span class="pitch" data-pitch="${w.pitch}" style="margin-left: 8px;"></span>
          </div>
          <div class="word-kana jp">${w.kana}<sup style="color: var(--akane);">${w.pitch}</sup></div>
        </div>
        <div class="flex items-center gap-2">
          <button class="btn-icon" style="width: 32px; height: 32px;" onclick="event.preventDefault(); JP.speak('${w.word}');">
            <i class="fas fa-volume-up text-sm" style="color: var(--akane);"></i>
          </button>
          <div>
            <div class="word-meaning">${w.meaning}</div>
            <div class="word-pos">${w.pos}</div>
          </div>
        </div>
      </a>
    `).join('');

    const totalCount = (data.vocabList || []).length;
    document.getElementById('vocabCount').textContent = currentPosFilter === 'all' 
      ? `— 共 ${list.length} 词 —`
      : `— ${list.length} / ${totalCount} 词 —`;
  }

  // 词性筛选点击
  document.querySelectorAll('[data-pos]').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('[data-pos]').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentPosFilter = chip.dataset.pos;
      renderVocabList();
    });
  });

  window.addEventListener('levelchange', renderVocabList);
  renderVocabList();
</script>
</body>
</html>
