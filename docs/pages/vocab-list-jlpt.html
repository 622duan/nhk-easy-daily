<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FAFAF7">
<title>JLPT真题词库 - 日本語ライフ</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  .jp { font-family: "Noto Sans JP", sans-serif; }

  .filter-chip {
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.05);
    font-size: 12px;
    color: var(--hae);
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .filter-chip.active {
    background: #7c3aed;
    color: white;
  }
  .filter-sticky {
    position: sticky;
    top: 104px;
    z-index: 39;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    margin: 0 -20px;
    padding: 10px 20px;
    border-bottom: 1px solid rgba(15, 23, 42, 0.05);
  }
  .filter-sticky .row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .word-row {
    background: white;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    transition: all 0.15s;
  }
  .word-row:active { transform: scale(0.98); background: var(--kinari); }

  .word-kanji {
    font-size: 22px;
    font-weight: 600;
    color: var(--sumi);
    line-height: 1.2;
  }
  .word-kana {
    font-size: 12px;
    color: var(--hae);
    margin-top: 2px;
  }
  .word-meaning {
    font-size: 13px;
    color: var(--hae);
    margin-left: auto;
    text-align: right;
    max-width: 110px;
  }
  .word-level {
    font-size: 10px;
    color: #7c3aed;
    background: rgba(124, 58, 237, 0.1);
    padding: 2px 6px;
    border-radius: 4px;
    margin-top: 2px;
    display: inline-block;
    font-weight: 600;
  }

  .header-banner {
    background: linear-gradient(135deg, #7c3aed 0%, #a78bfa 100%);
    color: white;
    padding: 16px 20px;
    border-radius: 16px;
    margin: 12px 20px;
    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2);
  }
  .header-banner h2 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .header-banner p {
    font-size: 12px;
    opacity: 0.9;
  }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="phone-screen">
    <div data-auto-stepper></div>

    <div class="nav-header">
      <div class="flex items-center gap-3">
        <a href="home.html" class="back-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
        <h1>JLPT真题</h1>
      </div>
    </div>

    <div class="header-banner">
      <h2>📚 JLPT真题词库</h2>
      <p>历年真题高频词汇 · 456词</p>
    </div>

    <!-- 等级筛选 -->
    <div class="filter-sticky">
      <div class="row">
        <div class="filter-chip active" data-level="all">全部</div>
        <div class="filter-chip" data-level="N1">N1</div>
        <div class="filter-chip" data-level="N2">N2</div>
        <div class="filter-chip" data-level="N3">N3</div>
        <div class="filter-chip" data-level="N4">N4</div>
        <div class="filter-chip" data-level="N5">N5</div>
      </div>
    </div>

    <!-- 词条列表 -->
    <div class="px-5 mt-4">
      <p class="text-xs text-muted mb-3" id="vocabSectionTitle">JLPT真题词汇</p>
      <div id="vocabListContainer"></div>
      <p class="text-center text-xs text-muted mt-3" id="vocabCount"></p>
    </div>

    <div style="height: 100px;"></div>

    <div class="tab-bar">
      <a class="tab-bar-item" href="home.html">
        <i class="fas fa-home"></i><span>首页</span>
      </a>
      <a class="tab-bar-item" href="vocab-list.html">
        <i class="fas fa-graduation-cap"></i><span>学习</span>
      </a>
      <a class="tab-bar-item" href="wordbook.html">
        <i class="fas fa-bookmark"></i><span>单词本</span>
      </a>
      <a class="tab-bar-item" href="profile.html">
        <i class="far fa-user"></i><span>我的</span>
      </a>
    </div>

  </div>
</div>
<script src="../main.js"></script>
<script src="../nhk-daily.js"></script>
<script src="../data.js"></script>
<script>
  let currentLevelFilter = 'all';

  function renderVocabList() {
    let list = (JP_DATA.specialized && JP_DATA.specialized.jlpt) || [];

    if (currentLevelFilter !== 'all') {
      list = list.filter(w => w.level === currentLevelFilter);
    }

    const container = document.getElementById('vocabListContainer');
    if (!container) return;

    if (list.length === 0) {
      container.innerHTML = '<p class="text-center text-muted text-sm" style="padding: 40px 0;">该等级下无词条</p>';
      document.getElementById('vocabCount').textContent = '';
      return;
    }

    container.innerHTML = list.map((w, i) => `
      <a href="vocab-card.html?w=${encodeURIComponent(w.word)}" class="word-row">
        <div class="flex-1">
          <div class="jp">
            <span class="word-kanji">${w.word}</span>
            <span class="pitch" data-pitch="${w.pitch}" style="margin-left: 8px;"></span>
          </div>
          <div class="word-kana jp">${w.kana}<sup style="color: #7c3aed;">${w.pitch}</sup></div>
        </div>
        <div class="flex items-center gap-2">
          <button class="btn-icon" style="width: 32px; height: 32px;" onclick="event.preventDefault(); JP.speak('${w.word}');">
            <i class="fas fa-volume-up text-sm" style="color: #7c3aed;"></i>
          </button>
          <div>
            <div class="word-meaning">${w.meaning}</div>
            <div class="word-level">${w.level}</div>
          </div>
        </div>
      </a>
    `).join('');

    const total = (JP_DATA.specialized.jlpt || []).length;
    document.getElementById('vocabCount').textContent = currentLevelFilter === 'all' 
      ? `— 共 ${list.length} 词 —`
      : `— ${list.length} / ${total} 词 —`;
  }

  document.querySelectorAll('[data-level]').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('[data-level]').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentLevelFilter = chip.dataset.level;
      renderVocabList();
    });
  });

  renderVocabList();
</script>
</body>
</html>
