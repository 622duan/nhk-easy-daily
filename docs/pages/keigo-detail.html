<style>
  body { padding: 0; }
  .jp { font-family: "Noto Sans JP", sans-serif; }

  .topic-hero {
    color: white;
    padding: 32px 20px 60px 20px;
    position: relative;
  }
  .topic-hero.sonkei { background: linear-gradient(135deg, #BC4E51 0%, #E76F72 100%); }
  .topic-hero.kenjou { background: linear-gradient(135deg, #1B3A5C 0%, #3A5F87 100%); }
  .topic-hero.teinei { background: linear-gradient(135deg, #10B981 0%, #34D399 100%); }
  .topic-hero::after {
    position: absolute;
    right: -10px; bottom: -40px;
    font-size: 180px;
    font-weight: 900;
    color: rgba(255,255,255,0.1);
    font-family: "Noto Sans JP", serif;
    line-height: 1;
  }
  .topic-hero.sonkei::after { content: "尊"; }
  .topic-hero.kenjou::after { content: "謙"; }
  .topic-hero.teinei::after { content: "丁"; }

  .transform-card {
    background: white;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.04);
  }
  .verb-form {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
  }
  .verb-form .original {
    flex: 1;
    background: rgba(15,23,42,0.04);
    padding: 10px 12px;
    border-radius: 10px;
    text-align: center;
  }
  .verb-form .arrow {
    color: var(--akane);
    font-size: 18px;
  }
  .verb-form .keigo {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    text-align: center;
  }
  .verb-form .keigo.sonkei {
    background: linear-gradient(135deg, rgba(188,78,81,0.08), rgba(188,78,81,0.04));
    border: 1px solid rgba(188,78,81,0.2);
  }
  .verb-form .keigo.kenjou {
    background: linear-gradient(135deg, rgba(27,58,92,0.08), rgba(27,58,92,0.04));
    border: 1px solid rgba(27,58,92,0.2);
  }
  .verb-form .keigo.teinei {
    background: linear-gradient(135deg, rgba(16,185,129,0.08), rgba(16,185,129,0.04));
    border: 1px solid rgba(16,185,129,0.2);
  }
  .verb-form .keigo .keigo-text { font-weight: 600; }
  .verb-form .keigo.sonkei .keigo-text { color: var(--akane); }
  .verb-form .keigo.kenjou .keigo-text { color: var(--ai-iro); }
  .verb-form .keigo.teinei .keigo-text { color: var(--n5); }
  .verb-form .label {
    font-size: 10px;
    color: var(--hae);
    margin-bottom: 2px;
  }

  .scenario-card {
    background: white;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.04);
  }
  .scenario-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 12px;
    border-bottom: 1px dashed rgba(15,23,42,0.1);
    margin-bottom: 12px;
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 16px;
  }
  .avatar.boss { background: linear-gradient(135deg, #1B3A5C, #3A5F87); }
  .avatar.you { background: linear-gradient(135deg, #BC4E51, #E76F72); }
  .avatar.chief { background: linear-gradient(135deg, #F59E0B, #FBBF24); }
  .avatar.client { background: linear-gradient(135deg, #10B981, #34D399); }

  .dialogue {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .dialogue .bubble {
    background: rgba(15,23,42,0.04);
    padding: 10px 12px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    max-width: 80%;
  }
  .dialogue.boss .bubble { border-top-left-radius: 4px; }
  .dialogue.you { flex-direction: row-reverse; }
  .dialogue.you .bubble {
    background: rgba(188,78,81,0.08);
    color: var(--sumi);
    border-top-right-radius: 4px;
  }
  .dialogue.you.kenjou .bubble {
    background: rgba(27,58,92,0.08);
  }
  .dialogue.you.teinei .bubble {
    background: rgba(16,185,129,0.08);
  }
  .dialogue.you.kenjou { flex-direction: row-reverse; }
  .dialogue.you.teinei { flex-direction: row-reverse; }

  .note-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(245, 158, 11, 0.12);
    color: #B45309;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
    margin-top: 4px;
  }
  .note-tag.kenjou { background: rgba(27,58,92,0.12); color: var(--ai-iro); }
  .note-tag.teinei { background: rgba(16,185,129,0.12); color: var(--n5); }

  .solid-word-card {
    background: white;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
</style>
</head>

        </div>
        <i class="fas fa-chevron-right text-muted text-xs"></i>
      </div>
    </div>

  </div>
</div>

          typeClass: 'you kenjou',
          bubble: 'はい、<ruby>恐<rt>おそれ</rt></ruby>いりながら、<ruby>御<rt>ご</rt></ruby><ruby>確認<rt>かくにん</rt></ruby>のほど、<ruby>宜<rt>よろ</rt></ruby>しく<ruby>お願い<rt>おねがい</rt></ruby><ruby>申<rt>もう</rt></ruby>し<ruby>上<rt>あ</rt></ruby>げます。',
          note: '完整敬语句型：恐れ入りますが...お願い申し上げます',
          noteClass: 'kenjou'
        }
      ]
    },

    'phone': {
      title: '📞 场景：电话第一通',
      cards: [
        {
          who: 'you', name: '你（鈴木）', sub: '打电话给客户公司',
          typeClass: 'you teinei',
          bubble: 'お<ruby>疲<rt>つか</rt></ruby>れさまでございます。いつもお<ruby>世話<rt>せわ</rt></ruby>になっております。',
          note: '电话问候的固定开场白',
          noteClass: 'teinei'
        },
        {
          who: 'client', name: '客户公司', sub: '前台',
          typeClass: 'client',
          bubble: 'お<ruby>電話<rt>でんわ</rt></ruby>ありがとうございます。',
          note: '',
          noteClass: ''
        },
        {
          who: 'you', name: '你', sub: '',
          typeClass: 'you teinei',
          bubble: '<ruby>私<rt>わたし</rt></ruby>、<ruby>山田商事<rt>やまだしょうじ</rt></ruby>の<ruby>鈴木<rt>すずき</rt></ruby>と<ruby>申<rt>もう</rt></ruby>します。<ruby>佐藤<rt>さとう</rt></ruby>さまはいらっしゃいますか。',
          note: '自报家门用"申します"，问对方在用"いらっしゃいます"',
          noteClass: 'teinei'
        },
        {
          who: 'client', name: '客户公司', sub: '',
          typeClass: 'client',
          bubble: '<ruby>佐藤<rt>さとう</rt></ruby>はただいま<ruby>席<rt>せき</rt></ruby>を<ruby>外<rt>はず</rt></ruby>しておりますが。',
          note: '',
          noteClass: ''
        },
        {
          who: 'you', name: '你', sub: '',
          typeClass: 'you teinei',
          bubble: 'それでは、お<ruby>戻<rt>もど</rt></ruby>り<ruby>次第<rt>しだい</rt></ruby>、お<ruby>電話<rt>でんわ</rt></ruby>を<ruby>頂<rt>いただ</rt></ruby>くよう、お<ruby>伝<rt>つた</rt></ruby>えいただけますでしょうか。',
          note: '礼貌请求："〜いただけますでしょうか"（能否麻烦您...）',
          noteClass: 'teinei'
        }
      ]
    }
  };

  function render() {
    const data = KEIGO_CONTENT[type] || KEIGO_CONTENT.sonkei;
    const hero = document.getElementById('topicHero');
    hero.className = 'topic-hero ' + data.heroClass;

    document.getElementById('heroSub').textContent = data.sub;
    document.getElementById('heroTitle').textContent = data.title;
    document.getElementById('heroDesc').textContent = data.desc;

    // 规则区
    const ruleEl = document.getElementById('ruleCard');
    const ruleTitleEl = document.getElementById('ruleTitle');
    if (type === 'teinei') {
      ruleTitleEl.innerHTML = '<i class="fas fa-magic" style="color: var(--n5);"></i> 句尾 + お/ご + 名词';
    } else {
      ruleTitleEl.innerHTML = '<i class="fas fa-magic text-akane"></i> 两种变形方式';
    }

    let modeLabel = '';
    if (type === 'sonkei') modeLabel = '方式一：お + 动词ます形词干 + になる';
    if (type === 'kenjou') modeLabel = '方式一：お + 动词ます形词干 + する';
    if (type === 'teinei') modeLabel = '规则一：句尾 + です・ます・ございます';

    const ruleContent = document.getElementById('ruleContent');
    if (type === 'teinei') {
      ruleContent.innerHTML = `
        <p class="text-xs text-muted mb-2">${modeLabel}</p>
        ${data.ruleExamples.map(ex => `
          <div style="padding: 10px 0; border-bottom: 1px dashed rgba(15,23,42,0.06);">
            <div class="verb-form">
              <div class="original">
                <div class="label">普通</div>
                <span class="jp font-semi">${ex.plain}</span>
              </div>
              <i class="fas fa-arrow-right arrow" style="color: var(--n5);"></i>
              <div class="keigo teinei">
                <div class="label">丁寧語</div>
                <span class="jp keigo-text">${ex.keigo}</span>
              </div>
              <button class="btn-icon" style="width: 36px; height: 36px;" onclick="JP.speak('${ex.keigo}')">
                <i class="fas fa-volume-up text-sm"></i>
              </button>
            </div>
            ${ex.sentence ? `<p class="text-xs jp" style="margin: 6px 0 0 0; padding: 6px 8px; background: rgba(16,185,129,0.04); border-radius: 6px; line-height: 1.5;">📖 ${ex.sentence}</p>` : ''}
            ${ex.note ? `<p class="text-xs text-muted" style="margin: 4px 0 0 0; padding-left: 4px;">💡 ${ex.note}</p>` : ''}
          </div>
        `).join('')}
        <div class="divider"></div>
        <p class="text-xs text-muted mb-2">规则二：名词前 + お/ご</p>
        <div class="grid grid-cols-2 gap-2">
          <div class="solid-word-card" style="background: rgba(16,185,129,0.04);">
            <p class="text-xs text-muted">名前 →</p>
            <p class="jp font-bold" style="color: var(--n5);">お名前</p>
          </div>
          <div class="solid-word-card" style="background: rgba(16,185,129,0.04);">
            <p class="text-xs text-muted">連絡 →</p>
            <p class="jp font-bold" style="color: var(--n5);">ご連絡</p>
          </div>
          <div class="solid-word-card" style="background: rgba(16,185,129,0.04);">
            <p class="text-xs text-muted">茶 →</p>
            <p class="jp font-bold" style="color: var(--n5);">お茶</p>
          </div>
          <div class="solid-word-card" style="background: rgba(16,185,129,0.04);">
            <p class="text-xs text-muted">質問 →</p>
            <p class="jp font-bold" style="color: var(--n5);">ご質問</p>
          </div>
        </div>
      `;
    } else {
      ruleContent.innerHTML = `
        <div class="transform-card" style="margin: 0; box-shadow: none; padding: 0;">
          <p class="text-xs text-muted mb-2">${modeLabel}</p>
          ${data.ruleExamples.map(ex => `
            <div style="padding: 10px 0; border-bottom: 1px dashed rgba(15,23,42,0.06);">
              <div class="verb-form">
                <div class="original">
                  <div class="label">普通</div>
                  <span class="jp font-semi">${ex.plain}</span>
                </div>
                <i class="fas fa-arrow-right arrow"></i>
                <div class="keigo ${type}">
                  <div class="label">${type === 'sonkei' ? '尊敬语' : '谦让语'}</div>
                  <span class="jp keigo-text">${ex.keigo}</span>
                </div>
                <button class="btn-icon" style="width: 36px; height: 36px;" onclick="JP.speak('${ex.keigo}')">
                  <i class="fas fa-volume-up text-sm"></i>
                </button>
              </div>
              ${ex.sentence ? `<p class="text-xs jp" style="margin: 6px 0 0 0; padding: 6px 8px; background: rgba(15,23,42,0.03); border-radius: 6px; line-height: 1.5;">📖 ${ex.sentence}</p>` : ''}
              ${ex.note ? `<p class="text-xs text-muted" style="margin: 4px 0 0 0; padding-left: 4px;">💡 ${ex.note}</p>` : ''}
            </div>
          `).join('')}
        </div>
      `;
    }

    // 专用词
    const sw = document.getElementById('specialWords');
    const swSection = document.getElementById('specialWordsSection');
    if (type === 'teinei') {
      swSection.style.display = '';
      document.getElementById('specialTitle').textContent = '句尾 · 词缀';
      sw.innerHTML = data.specialWords.map(w => {
        return `
          <div class="solid-word-card" style="background: rgba(16,185,129,0.04); text-align: left; padding: 10px 12px;">
            <p class="text-xs text-muted">${w.plain} →</p>
            <p class="jp font-bold" style="color: var(--n5);">${w.keigo}</p>
            ${w.sentence ? `<p class="text-xs jp" style="margin-top: 4px; line-height: 1.4; color: var(--sumi);">${w.sentence}</p>` : ''}
            <button class="btn-icon" style="width: 24px; height: 24px; margin-top: 4px;" onclick="JP.speak('${w.keigo}')">
              <i class="fas fa-volume-up" style="font-size: 10px; color: var(--n5);"></i>
            </button>
          </div>
        `;
      }).join('');
    } else {
      swSection.style.display = '';
      document.getElementById('specialTitle').textContent = type === 'sonkei' ? '专用尊敬语动词' : '专用谦让语动词';
      sw.innerHTML = data.specialWords.map(w => {
        const bg = type === 'sonkei' ? 'rgba(188,78,81,0.04)' : 'rgba(27,58,92,0.04)';
        const color = type === 'sonkei' ? 'var(--akane)' : 'var(--ai-iro)';
        return `
          <div class="solid-word-card" style="background: ${bg}; text-align: left; padding: 10px 12px;">
            <p class="text-xs text-muted">${w.plain} →</p>
            <p class="jp font-bold" style="color: ${color};">${w.keigo}</p>
            ${w.sentence ? `<p class="text-xs jp" style="margin-top: 4px; line-height: 1.4; color: var(--sumi);">${w.sentence}</p>` : ''}
            <button class="btn-icon" style="width: 24px; height: 24px; margin-top: 4px;" onclick="JP.speak('${w.keigo}')">
              <i class="fas fa-volume-up" style="font-size: 10px; color: ${color};"></i>
            </button>
          </div>
        `;
      }).join('');
    }

    // 场景
    const scenario = SCENARIOS[data.scenario];
    document.getElementById('scenarioTitle').innerHTML = scenario.title;
    const sc = document.getElementById('scenarioContainer');
    sc.innerHTML = scenario.cards.map(card => `
      <div class="scenario-card">
        <div class="scenario-header">
          <div class="avatar ${card.typeClass}">
            <i class="fas fa-${card.who === 'you' ? 'user' : card.who === 'boss' ? 'user-tie' : card.who === 'client' ? 'handshake' : 'user'}"></i>
          </div>
          <div>
            <p class="font-bold text-sm">${card.name}</p>
            <p class="text-xs text-muted">${card.sub}</p>
          </div>
        </div>
        <div class="dialogue ${card.who} ${card.typeClass.replace('you', '').trim()}">
          <div class="bubble jp">${card.bubble}${card.note ? `<div class="note-tag ${card.noteClass}">${card.note}</div>` : ''}</div>
        </div>
      </div>
    `).join('');

    // 贴士
    document.getElementById('tipTitle').textContent = data.tipTitle;
    document.getElementById('tipBody').textContent = data.tipBody;

    // 音频
    document.getElementById('audioPlay').onclick = () => JP.speak(data.audioText);
  }

  render();
</script>
</body>
</html>
