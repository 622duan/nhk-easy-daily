name: NHK Daily Update

# 自动 + 手动触发
# 每天 UTC 0:00 (北京时间 8:00, 东京时间 9:00) 自动跑
# 也支持手动触发
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "抓取篇数"
        required: false
        default: "5"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 备份前一天内容
        # 把 HEAD 的 nhk-app-format.json 保存为 yesterday.json
        # 这样 fetch 抓空时, fetch_nhk.py 会自动用 yesterday 兜底
        run: |
          mkdir -p data
          # 如果 HEAD 有内容, 拷贝; 否则写空 JSON
          git show HEAD:data/nhk-app-format.json > data/yesterday.json 2>/dev/null || \
            echo '{"fetched_at": "", "source": "https://www3.nhk.or.jp/news/easy/", "article_count": 0, "used_yesterday": false, "fetch_error": "", "articles": []}' > data/yesterday.json
          # 输出昨天有多少条
          python -c "
          import json
          try:
              with open('data/yesterday.json') as f: d = json.load(f)
              print('YESTERDAY_ITEMS=' + str(len(d.get('articles', []))))
          except: print('YESTERDAY_ITEMS=0')
          "

      - name: 抓取 NHK Easy News
        id: fetch
        env:
          LIMIT: ${{ github.event.inputs.limit || '5' }}
        run: |
          python scripts/fetch_nhk.py --limit "${LIMIT}" --output data/nhk-today.json
        continue-on-error: true

      - name: 抓取 Yahoo News Japan
        id: fetch_yahoo
        env:
          LIMIT: ${{ github.event.inputs.limit || '4' }}
        run: |
          python scripts/fetch_yahoo.py --limit "${LIMIT}" --output data/yahoo-today.json
        continue-on-error: true

      - name: 转换为 app 格式 (NHK + Yahoo)
        if: steps.fetch.outcome == 'success' || steps.fetch_yahoo.outcome == 'success'
        run: |
          python scripts/format_data.py \
            --input data/nhk-today.json \
            --yahoo-input data/yahoo-today.json \
            --output data/nhk-app-format.json

      - name: 验证输出
        if: steps.fetch.outcome == 'success' || steps.fetch_yahoo.outcome == 'success'
        run: |
          python -c "
          import json
          with open('data/nhk-app-format.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          items = data.get('items', [])
          if not items:
              print('WARN: items is empty')
          else:
              sources = {}
              for i in items:
                  s = i.get('source', 'unknown')
                  sources[s] = sources.get(s, 0) + 1
              print('OK: ' + str(len(items)) + ' articles, sources=' + str(sources))
          "

      - name: 提交变更
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ .github/workflows/ scripts/
          git diff --staged --quiet && echo 'no changes' && exit 0
          # 看看用没用昨天
          USED=$(python -c "import json;print(json.load(open('data/nhk-app-format.json')).get('used_yesterday', False))")
          if [ "$USED" = "True" ]; then
            git commit -m "data: NHK daily update $(date -u +%Y-%m-%d) (used yesterday)"
          else
            git commit -m "data: NHK daily update $(date -u +%Y-%m-%d)"
          fi
          git push
