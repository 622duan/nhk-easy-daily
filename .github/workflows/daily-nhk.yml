name: NHK Daily Update

# 自动 + 手动触发
# 每天 UTC 0:00 (北京时间 8:00, 东京时间 9:00) 自动跑
# 也支持手动触发
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "抓取篇数"
        required: false
        default: "5"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取 NHK Easy News
        id: fetch
        env:
          LIMIT: ${{ github.event.inputs.limit || '5' }}
        run: |
          mkdir -p data
          python scripts/fetch_nhk.py --limit "${LIMIT}" --output data/nhk-today.json
        continue-on-error: true

      - name: 转换为 app 格式
        if: steps.fetch.outcome == 'success'
        run: python scripts/format_data.py --input data/nhk-today.json --output data/nhk-app-format.json

      - name: 验证输出
        if: steps.fetch.outcome == 'success'
        run: |
          python -c "
          import json
          with open('data/nhk-app-format.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          items = data.get('items', [])
          if not items:
              raise SystemExit('no items in output')
          total_words = sum(len(i['words']) for i in items)
          print('OK: ' + str(len(items)) + ' articles, ' + str(total_words) + ' words')
          "

      - name: 提交变更
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: daily NHK update $(date -u +%Y-%m-%d)"
          git push
